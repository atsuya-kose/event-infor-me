<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>おでかけイベント(杉並・世田谷・吉祥寺/東京/関東近郊)</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #26231f; --muted: #6f6a62;
    --line: #e7e1d8; --accent: #d9622b; --accent-soft: #fbe9df;
    --family: #2f7d5b; --family-soft: #e1f2ea; --gourmet: #b4492a; --gourmet-soft: #fbe5dc; --drink: #7a3fa0; --drink-soft: #efe3f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1815; --card: #24211d; --text: #efeae2; --muted: #a39d92;
      --line: #38332d; --accent: #f0845a; --accent-soft: #3a2a21;
      --family: #6cc79d; --family-soft: #1f3329; --gourmet: #f19a7c; --gourmet-soft: #3b2620; --drink: #cfa2ee; --drink-soft: #33263f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.35rem; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: .85rem; margin: 0 0 16px; }
  .group-label { font-size: .75rem; color: var(--muted); margin: 10px 2px 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: .88rem; cursor: pointer; font-family: inherit; }
  .chip .n { opacity: .65; margin-left: 4px; font-size: .78rem; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: .82rem; margin: 14px 2px 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 1.02rem; margin: 6px 0 4px; line-height: 1.4; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font-size: .72rem; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .tag.family { background: var(--family-soft); color: var(--family); }
  .tag.gourmet { background: var(--gourmet-soft); color: var(--gourmet); }
  .tag.drink { background: var(--drink-soft); color: var(--drink); }
  .tag.status { background: var(--accent-soft); color: var(--accent); }
  .tag.free { background: #fff3c4; color: #7a5a00; }
  @media (prefers-color-scheme: dark) { .tag.free { background: #4a3d12; color: #f3d778; } }
  .tag.area { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 400; }
  .meta { font-size: .85rem; color: var(--muted); margin: 2px 0; }
  .summary { font-size: .9rem; margin: 8px 0 6px; }
  .src { font-size: .8rem; }
  a { color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { color: var(--muted); font-size: .78rem; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>おでかけイベント</h1>
  <p class="sub">家族・グルメ・お酒のイベントを厳選 ／ 毎日更新 ／ 最終更新: <span id="updated"></span></p>

  <div class="group-label">エリア</div>
  <div class="controls" id="zone-controls"></div>
  <div class="group-label">時期</div>
  <div class="controls" id="time-controls"></div>
  <div class="group-label">料金</div>
  <div class="controls" id="free-controls"></div>

  <div class="count" id="count"></div>
  <div id="list"></div>

  <footer>
    「直近1週間」は今日から7日以内に開催(または開催中)のもの、「1週間以上先」はそれより後に始まるものです。
    開催日・料金・予約の要否は変更される場合があります。お出かけ前に必ずリンク先や公式サイトで最新情報をご確認ください。
    リンクは情報の出典ページです。
  </footer>
</div>

<script src="events.js"></script>
<script>
(function () {
  var DAY = 86400000;
  var ZONES = [
    { key: "all", label: "すべて" },
    { key: "local", label: "杉並・世田谷・吉祥寺周辺" },
    { key: "tokyo", label: "東京都内" },
    { key: "kanto", label: "関東近郊" }
  ];
  var TIMES = [
    { key: "all", label: "すべて" },
    { key: "week", label: "直近1週間" },
    { key: "later", label: "1週間以上先" }
  ];
  var FREES = [
    { key: "all", label: "すべて" },
    { key: "free", label: "無料のみ" }
  ];
  var state = { zone: "all", time: "all", free: "all" };

  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function fmt(d) { return (d.getMonth() + 1) + "/" + d.getDate() + "(" + "日月火水木金土"[d.getDay()] + ")"; }
  function fmtFull(d, withYear) { return (withYear ? d.getFullYear() + "/" : "") + fmt(d); }

  function period(e) {
    var s = parse(e.start), end = e.end ? parse(e.end) : null;
    var y = new Date().getFullYear();
    var withYear = s.getFullYear() !== y || (end && end.getFullYear() !== y);
    if (!end) return fmtFull(s, withYear) + " 〜(終了日未確認)";
    if (e.start === e.end) return fmtFull(s, withYear);
    return fmtFull(s, withYear) + " 〜 " + fmtFull(end, withYear);
  }

  function statusOf(e, t) {
    var s = parse(e.start), end = e.end ? parse(e.end) : null;
    if (s <= t && (!end || end >= t)) {
      if (end && (end - t) / DAY <= 3) return "まもなく終了";
      return "開催中";
    }
    var d = Math.round((s - t) / DAY);
    return d <= 7 ? "あと" + d + "日で開始" : "";
  }

  function alive(e, t) { return !e.end || parse(e.end) >= t; }

  function inTime(e, t, key) {
    if (key === "all") return true;
    var limit = new Date(t.getTime() + 7 * DAY);
    var s = parse(e.start);
    if (key === "week") return s <= limit;     // 今日〜7日後に開催中 or 開始
    return s > limit;                          // 7日より後に開始
  }

  function matches(e, t, f) {
    return alive(e, t) && (f.zone === "all" || e.zone === f.zone) && inTime(e, t, f.time) &&
      (f.free === "all" || e.free === true);
  }
  function withState(key, value) {
    var f = { zone: state.zone, time: state.time, free: state.free };
    f[key] = value;
    return f;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderChips(containerId, defs, key) {
    var t = today();
    var box = document.getElementById(containerId);
    box.textContent = "";
    defs.forEach(function (d) {
      var f = withState(key, d.key);
      var n = window.EVENTS.filter(function (e) { return matches(e, t, f); }).length;
      var b = el("button", "chip", d.label);
      b.type = "button";
      b.setAttribute("aria-pressed", state[key] === d.key ? "true" : "false");
      b.appendChild(el("span", "n", String(n)));
      b.addEventListener("click", function () { state[key] = d.key; render(); });
      box.appendChild(b);
    });
  }

  function render() {
    var t = today();
    renderChips("zone-controls", ZONES, "zone");
    renderChips("time-controls", TIMES, "time");
    renderChips("free-controls", FREES, "free");

    var items = window.EVENTS.filter(function (e) { return matches(e, t, state); });
    items.sort(function (a, b) {
      var ka = Math.max(parse(a.start), t), kb = Math.max(parse(b.start), t);
      return ka - kb || parse(a.start) - parse(b.start);
    });
    var list = document.getElementById("list");
    list.textContent = "";
    document.getElementById("count").textContent = items.length + " 件";
    if (!items.length) { list.appendChild(el("div", "empty", "条件に合うイベントはありません")); return; }

    items.forEach(function (e) {
      var card = el("article", "card");
      var tags = el("div", "row");
      var st = statusOf(e, t);
      if (st) tags.appendChild(el("span", "tag status", st));
      if (e.free === true) tags.appendChild(el("span", "tag free", "無料"));
      e.categories.forEach(function (c) {
        tags.appendChild(el("span", "tag " + c, ({ family: "家族向け", gourmet: "グルメ", drink: "お酒" })[c] || c));
      });
      tags.appendChild(el("span", "tag area", e.area));
      card.appendChild(tags);
      card.appendChild(el("h2", null, e.title));
      card.appendChild(el("div", "meta", "📅 " + period(e)));
      card.appendChild(el("div", "meta", "📍 " + e.venue));
      card.appendChild(el("div", "meta", "💴 " + e.price));
      card.appendChild(el("p", "summary", e.summary));
      var src = el("div", "src");
      var a = el("a", null, "詳細(出典: " + e.source + ")");
      a.href = e.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      src.appendChild(a);
      card.appendChild(src);
      list.appendChild(card);
    });
  }

  document.getElementById("updated").textContent = window.LAST_UPDATED.replace(/-/g, "/");
  render();
})();
</script>
</body>
</html>
